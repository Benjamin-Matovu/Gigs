name: Deploy from main

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: install dependencies
        run: npm intall
      - name: run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build tagged image
        run: docker build -t ghcr.io/Benjamin-Matovu/image-1:v1 .

  push:
    runs-on: ubuntu-latest
    steps:
      - name: login into ghcr
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: push to ghcr
        run: docker push ghcr.io/Benjamin-Matovu/image-1:v1
